stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:latest

build_image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build -t $IMAGE_TAG ./Docker
    - docker push $IMAGE_TAG

deploy_app:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - cd Docker
    - |
      sed -i "s|my-nginx-secure:1.0.0|$IMAGE_TAG|g" docker-compose.yml
    - docker compose up -d
    - sleep 5
    - curl -k https://localhost:443