name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t my-nginx-secure:1.0.0 ./Docker

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t my-nginx-secure:1.0.0 ./Docker
      - name: Run container and test
        run: |
          cd Docker
          docker compose up -d
          echo "Ждем запуска Nginx..."
          sleep 10
          echo "СТАТУС КОНТЕЙНЕРА"
          docker compose ps
          echo "ЛОГИ (если упал)"
          docker compose logs
          echo "ТЕСТ CURL"
          curl -k -v --http1.1 https://localhost:443